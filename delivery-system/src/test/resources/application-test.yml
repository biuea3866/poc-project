spring:
  jpa:
    hibernate:
      # 통합 테스트는 Testcontainers MySQL 위에서 매 JVM 마다 스키마를 새로 만든다.
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never

logging:
  level:
    # 100~200 스레드 동시 수락 로그로 측정 표가 묻히지 않게 한다.
    root: warn
    com.biuea.delivery: info
