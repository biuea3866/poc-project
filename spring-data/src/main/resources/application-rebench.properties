# 파티셔닝 재검증 프로파일. DB 는 REBENCH_DB 환경변수로 전환한다 (partition_uniform / partition_skewed).
spring.datasource.url=jdbc:mysql://localhost:3316/${REBENCH_DB:partition_uniform}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 커넥션 풀은 부하 프로파일의 최대 VU(50) 보다 넉넉하게 잡아, 풀 대기가 측정값에 섞이지 않게 한다.
spring.datasource.hikari.maximum-pool-size=80
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# 이 프로파일은 MySQL 만 쓴다. 브로커가 없으면 컨슈머 기동에서 막히고 접속 재시도가 측정 구간을 오염시킨다.
# 실제 차단은 kafka 패키지의 @Profile("!rebench") 가 한다 — 이 설정만으로는 커스텀 컨테이너 팩토리를
# 쓰는 리스너가 그대로 떴다. 아래 값은 표준 리스너까지 확실히 막기 위한 이중 안전장치다.
# KafkaAutoConfiguration 자체를 제외하는 방법은 @KafkaListener 가 ConsumerFactory 를 못 찾아 기동이 실패한다.
spring.kafka.listener.auto-startup=false

logging.level.root=WARN
logging.level.com.biuea.springdata=WARN
